services:
  - type: web
    name: sarjy
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore  # same region as the Supabase project (ap-southeast-1)
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CALCOM_API_KEY
        sync: false
      - key: DATABASE_URL  # Supabase "Session pooler" connection string
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
