<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sarjy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d4aff'/%3E%3Cstop offset='1' stop-color='%2319b8a8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- sign in -->
    <div id="login-box" class="login-screen">
      <form class="login-card" id="login-form">
        <div class="orb big"></div>
        <h1>Sarjy</h1>
        <p>Your voice assistant for booking a call with our team.</p>
        <input class="field" id="username" placeholder="Username" autocomplete="username" required />
        <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password" required />
        <button class="primary" id="login" type="submit">Sign in</button>
        <div class="error" id="login-error"></div>
        <div class="hint">First time? Any username and password creates your account.</div>
      </form>
    </div>

    <!-- app -->
    <div id="app" class="app" hidden>
      <header>
        <button class="ghost chats-toggle" id="chats-toggle" title="Your chats">☰</button>
        <div class="orb small" id="header-orb"></div>
        <div class="title">Sarjy</div>
        <span class="user-chip" id="whoami"></span>
        <button class="ghost" id="memory-toggle" title="What Sarjy remembers about you">
          <span>🧠</span><span class="label">Memory</span><span class="count" id="memory-count">0</span>
        </button>
        <button class="ghost" id="logout">Sign out</button>
      </header>

      <div class="body">
        <aside class="chats" id="chats-panel">
          <div class="chats-head">
            <button class="new" id="new-chat">＋ New chat</button>
            <button class="memory-close" id="chats-close" title="Close" style="position:static">×</button>
          </div>
          <ul class="chat-list" id="chat-list"></ul>
        </aside>

        <main class="chat">
          <div class="messages" id="messages">
            <div class="messages-inner" id="log"></div>
          </div>

          <div class="status" id="status">
            <span class="dot"></span><span id="status-text">Ready</span>
            <button class="stop" id="stop" hidden>Stop</button>
          </div>

          <div class="composer-wrap">
            <form class="composer" id="composer">
              <input id="msg" placeholder="Type a message, or tap the mic to talk…" autocomplete="off" />
              <button class="icon-btn" id="voice-toggle" type="button" title="Voice replies on/off">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="voice-waves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
              </button>
              <button class="icon-btn send" id="send" type="submit" title="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
              </button>
              <button class="mic" id="record" type="button" title="Tap to talk, tap again to send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
              </button>
            </form>
          </div>
        </main>

        <aside class="memory" id="memory-panel" hidden>
          <div class="memory-head">
            <button class="memory-close" id="memory-close" title="Close">×</button>
            <h3>What Sarjy remembers</h3>
            <p>Facts about you, shared across all your chats. Each chat keeps its own conversation. Tap × to make Sarjy forget something.</p>
          </div>
          <ul class="memory-list" id="memory-list"></ul>
        </aside>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
