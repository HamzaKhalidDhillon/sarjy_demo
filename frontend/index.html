<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sarjy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d4aff'/%3E%3Cstop offset='1' stop-color='%2319b8a8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #f5f4fb;
        --surface: #ffffff;
        --surface-2: #f0eef8;
        --text: #1d1b2e;
        --muted: #6b6880;
        --border: #e5e2f0;
        --accent: #6d4aff;
        --accent-2: #19b8a8;
        --danger: #d9435b;
        --user-bubble: linear-gradient(135deg, #6d4aff, #8f5cff);
        --shadow: 0 10px 30px rgba(40, 20, 120, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0e17;
          --surface: #1a1826;
          --surface-2: #232033;
          --text: #eceaf5;
          --muted: #9d99b3;
          --border: #2c293d;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        height: 100dvh;
      }
      button { font: inherit; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }

      /* the animated gradient ball used as Sarjy's avatar */
      .orb {
        width: 40px; height: 40px; border-radius: 50%; flex: none;
        background: radial-gradient(circle at 30% 30%, #b9a6ff, var(--accent) 45%, var(--accent-2));
        box-shadow: 0 0 0 0 rgba(109, 74, 255, 0.4);
      }
      .orb.big { width: 88px; height: 88px; }
      .orb.small { width: 30px; height: 30px; }
      .orb.active { animation: breathe 1.4s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(109, 74, 255, 0.35); }
        50% { transform: scale(1.08); box-shadow: 0 0 0 12px rgba(109, 74, 255, 0); }
      }

      /* ---------- sign in ---------- */
      .login-screen { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
      .login-card {
        width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
        border-radius: 20px; padding: 32px 28px; box-shadow: var(--shadow); text-align: center;
      }
      .login-card .orb { margin: 0 auto 14px; }
      .login-card h1 { margin: 0; font-size: 26px; }
      .login-card p { margin: 6px 0 22px; color: var(--muted); }
      .field {
        width: 100%; padding: 12px 14px; margin-bottom: 10px; border-radius: 12px;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit;
      }
      .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .primary {
        width: 100%; padding: 12px; border: 0; border-radius: 12px; color: #fff;
        background: var(--user-bubble); font-weight: 600;
      }
      .error { color: var(--danger); min-height: 1.5em; margin-top: 10px; font-size: 14px; }
      .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

      /* ---------- app shell ---------- */
      .app { height: 100%; display: flex; flex-direction: column; }
      header {
        display: flex; align-items: center; gap: 10px; padding: 12px 16px;
        border-bottom: 1px solid var(--border); background: var(--surface);
      }
      header .title { font-weight: 700; font-size: 18px; margin-right: auto; }
      .ghost {
        border: 1px solid var(--border); background: transparent; color: var(--text);
        padding: 7px 12px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px;
      }
      .ghost:hover { background: var(--surface-2); }
      .ghost .count {
        background: var(--accent); color: #fff; border-radius: 999px; font-size: 12px;
        padding: 0 7px; min-width: 20px; text-align: center;
      }
      .user-chip { color: var(--muted); font-size: 14px; }
      @media (max-width: 640px) { .user-chip, .ghost .label { display: none; } }

      .body { flex: 1; display: flex; min-height: 0; }
      .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }

      /* ---------- messages ---------- */
      .messages { flex: 1; overflow-y: auto; padding: 24px 16px; }
      .messages-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      .row { display: flex; gap: 10px; align-items: flex-end; animation: pop 0.25s ease-out; }
      .row.user { justify-content: flex-end; }
      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .bubble {
        max-width: min(80%, 560px); padding: 10px 14px; border-radius: 18px;
        white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .row.sarjy .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
      .row.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 6px; }
      .row.error .bubble { border-color: var(--danger); color: var(--danger); }
      .via { display: block; font-size: 11px; opacity: 0.75; margin-bottom: 2px; }
      .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; margin-left: 1px; }
      @keyframes blink { 50% { opacity: 0; } }
      .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
      .typing span {
        width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
        animation: bounce 1.2s infinite ease-in-out;
      }
      .typing span:nth-child(2) { animation-delay: 0.15s; }
      .typing span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-5px); opacity: 1; } }

      .empty { text-align: center; padding: 48px 8px 16px; }
      .empty .orb { margin: 0 auto 18px; }
      .empty h2 { margin: 0 0 6px; font-size: 22px; }
      .empty p { margin: 0 auto 20px; color: var(--muted); max-width: 420px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .chip {
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        padding: 8px 14px; border-radius: 999px; font-size: 14px;
      }
      .chip:hover { border-color: var(--accent); color: var(--accent); }

      /* ---------- status + composer ---------- */
      .status {
        max-width: 760px; width: 100%; margin: 0 auto; padding: 0 16px 6px;
        display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-height: 28px;
      }
      .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); }
      .status.busy .dot { animation: breathe 1.2s infinite; background: var(--accent); }
      .status.listening .dot { background: var(--danger); animation: breathe 1s infinite; }
      .status .stop {
        margin-left: auto; border: 1px solid var(--border); background: var(--surface);
        color: var(--text); border-radius: 8px; padding: 2px 10px; font-size: 13px;
      }
      .composer-wrap { padding: 0 16px 16px; }
      .composer {
        max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
        background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
        padding: 6px 6px 6px 16px; box-shadow: var(--shadow);
      }
      .composer input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: inherit; padding: 8px 0; }
      .composer input:focus { outline: none; }
      .icon-btn {
        width: 42px; height: 42px; border-radius: 12px; border: 0; flex: none;
        display: grid; place-items: center; background: var(--surface-2); color: var(--text);
      }
      .icon-btn.send { background: var(--accent); color: #fff; }
      .icon-btn.voice-off { color: var(--muted); }
      .icon-btn svg { width: 20px; height: 20px; }
      .mic {
        --level: 0;
        width: 48px; height: 48px; border-radius: 50%; border: 0; flex: none; position: relative;
        display: grid; place-items: center; color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      .mic svg { width: 22px; height: 22px; position: relative; }
      /* ring that grows with your voice level while recording */
      .mic::before {
        content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--danger);
        opacity: 0; transform: scale(1);
        transition: transform 0.08s linear;
      }
      .mic.recording { background: var(--danger); }
      .mic.recording::before { opacity: 0.3; transform: scale(calc(1 + var(--level) * 0.9)); }

      /* ---------- memory panel ---------- */
      .memory {
        width: 300px; flex: none; border-left: 1px solid var(--border); background: var(--surface);
        display: flex; flex-direction: column; min-height: 0;
      }
      .memory-head { padding: 16px; border-bottom: 1px solid var(--border); position: relative; }
      .memory-close {
        position: absolute; top: 10px; right: 10px; border: 0; background: transparent;
        color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 8px; border-radius: 8px;
      }
      .memory-close:hover { background: var(--surface-2); color: var(--text); }
      .memory-head h3 { margin: 0; font-size: 15px; }
      .memory-head p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
      .memory-list { list-style: none; margin: 0; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .memory-item {
        display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
        background: var(--surface-2); border-radius: 12px; border: 1px solid transparent;
      }
      .memory-item.new { animation: glow 2.4s ease-out; }
      @keyframes glow { 0% { border-color: var(--accent-2); background: rgba(25, 184, 168, 0.18); } 100% { border-color: transparent; } }
      .memory-item .text { flex: 1; min-width: 0; }
      .memory-item .k { display: block; font-size: 12px; color: var(--muted); }
      .memory-item .v { overflow-wrap: anywhere; }
      .memory-item button {
        border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px;
      }
      .memory-item button:hover { color: var(--danger); }
      .memory-empty { color: var(--muted); font-size: 14px; padding: 4px 4px; }
      @media (max-width: 900px) {
        .memory { position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 88vw); z-index: 10; box-shadow: var(--shadow); }
      }
    </style>
  </head>
  <body>
    <!-- sign in -->
    <div id="login-box" class="login-screen">
      <form class="login-card" id="login-form">
        <div class="orb big"></div>
        <h1>Sarjy</h1>
        <p>Your voice assistant for booking a call with our team.</p>
        <input class="field" id="username" placeholder="Username" autocomplete="username" required />
        <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password" required />
        <button class="primary" id="login" type="submit">Sign in</button>
        <div class="error" id="login-error"></div>
        <div class="hint">First time? Any username and password creates your account.</div>
      </form>
    </div>

    <!-- app -->
    <div id="app" class="app" hidden>
      <header>
        <div class="orb small" id="header-orb"></div>
        <div class="title">Sarjy</div>
        <span class="user-chip" id="whoami"></span>
        <button class="ghost" id="memory-toggle" title="What Sarjy remembers about you">
          <span>🧠</span><span class="label">Memory</span><span class="count" id="memory-count">0</span>
        </button>
        <button class="ghost" id="new-chat" title="Start a new conversation">＋<span class="label">New chat</span></button>
        <button class="ghost" id="logout">Sign out</button>
      </header>

      <div class="body">
        <main class="chat">
          <div class="messages" id="messages">
            <div class="messages-inner" id="log"></div>
          </div>

          <div class="status" id="status">
            <span class="dot"></span><span id="status-text">Ready</span>
            <button class="stop" id="stop" hidden>Stop</button>
          </div>

          <div class="composer-wrap">
            <form class="composer" id="composer">
              <input id="msg" placeholder="Type a message, or tap the mic to talk…" autocomplete="off" />
              <button class="icon-btn" id="voice-toggle" type="button" title="Voice replies on/off">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="voice-waves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
              </button>
              <button class="icon-btn send" id="send" type="submit" title="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
              </button>
              <button class="mic" id="record" type="button" title="Tap to talk, tap again to send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
              </button>
            </form>
          </div>
        </main>

        <aside class="memory" id="memory-panel" hidden>
          <div class="memory-head">
            <button class="memory-close" id="memory-close" title="Close">×</button>
            <h3>What Sarjy remembers</h3>
            <p>Saved across sessions. Tap × to make Sarjy forget something.</p>
          </div>
          <ul class="memory-list" id="memory-list"></ul>
        </aside>
      </div>
    </div>

    <script>
      // All server text is rendered with textContent, never innerHTML, so nothing a user or the
      // model says can inject script into the page (the sign-in token lives in localStorage).
      const $ = (id) => document.getElementById(id);
      const logEl = $('log');
      const messagesEl = $('messages');
      let conversationId = null;
      let busy = false;
      let knownMemoryIds = new Set();
      let memoryLoaded = false;
      let voiceOn = true;
      try { voiceOn = localStorage.getItem('sarjy_voice') !== 'off'; } catch (e) {}

      // ---------- sign in ----------
      function token() { try { return localStorage.getItem('sarjy_token'); } catch (e) { return null; } }

      function showApp() {
        const signedIn = !!token();
        $('login-box').hidden = signedIn;
        $('app').hidden = !signedIn;
        if (!signedIn) return;
        $('whoami').textContent = localStorage.getItem('sarjy_username') || '';
        $('memory-panel').hidden = window.innerWidth <= 900;
        renderVoiceToggle();
        newChat();
        loadMemory();
      }

      $('login-form').onsubmit = async (e) => {
        e.preventDefault();
        $('login-error').textContent = '';
        $('login').disabled = true;
        try {
          const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: $('username').value, password: $('password').value }),
          });
          const j = await res.json();
          if (!res.ok) { $('login-error').textContent = j.detail || 'Sign in failed'; return; }
          localStorage.setItem('sarjy_token', j.token);
          localStorage.setItem('sarjy_username', j.username);
          showApp();
        } catch (err) {
          $('login-error').textContent = 'Could not reach the server. It may be waking up, try again in a moment.';
        } finally {
          $('login').disabled = false;
        }
      };

      function logout() {
        stopSpeaking();
        localStorage.removeItem('sarjy_token');
        localStorage.removeItem('sarjy_username');
        knownMemoryIds = new Set();
        memoryLoaded = false;
        showApp();
      }
      $('logout').onclick = logout;

      // fetch() that adds the token, and sends you back to sign in if it's no longer valid
      async function api(url, options = {}) {
        const headers = { ...(options.headers || {}), Authorization: `Bearer ${token()}` };
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401) { logout(); throw new Error('signed out'); }
        return res;
      }

      // ---------- status line ----------
      const STATUS = {
        idle: ['Ready', ''],
        listening: ['Listening… tap the mic again to send', 'listening'],
        uploading: ['Uploading your recording…', 'busy'],
        transcribing: ['Transcribing what you said…', 'busy'],
        thinking: ['Sarjy is thinking…', 'busy'],
        voicing: ['Preparing voice…', 'busy'],
        speaking: ['Sarjy is speaking', 'busy'],
      };
      let slowTimer = null;
      function setStatus(state, textOverride) {
        const [text, cls] = STATUS[state];
        $('status').className = 'status ' + cls;
        $('status-text').textContent = textOverride || text;
        $('stop').hidden = state !== 'speaking' && state !== 'voicing';
        $('header-orb').classList.toggle('active', state === 'speaking');
        clearTimeout(slowTimer);
        if (state === 'thinking') {
          // the free server sleeps when idle, and the first request after that is slow
          slowTimer = setTimeout(() => {
            $('status-text').textContent = 'Still working… the server may be waking up (up to a minute)';
          }, 8000);
        }
      }

      function setBusy(value) {
        busy = value;
        $('send').disabled = value;
        $('record').disabled = value && !recording;
      }

      // ---------- messages ----------
      function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

      function addRow(who, text, via) {
        logEl.querySelector('.empty')?.remove();
        const row = document.createElement('div');
        row.className = 'row ' + who;
        if (who !== 'user') {
          const orb = document.createElement('div');
          orb.className = 'orb small';
          row.appendChild(orb);
        }
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (via) {
          const tag = document.createElement('span');
          tag.className = 'via';
          tag.textContent = via;
          bubble.appendChild(tag);
        }
        const body = document.createElement('span');
        body.textContent = text || '';
        bubble.appendChild(body);
        row.appendChild(bubble);
        logEl.appendChild(row);
        scrollDown();
        return { row, body };
      }

      function addTypingRow() {
        const { row, body } = addRow('sarjy', '');
        const dots = document.createElement('span');
        dots.className = 'typing';
        dots.append(document.createElement('span'), document.createElement('span'), document.createElement('span'));
        body.appendChild(dots);
        return { row, body };
      }

      function showEmptyState() {
        logEl.textContent = '';
        const wrap = document.createElement('div');
        wrap.className = 'empty';
        const orb = document.createElement('div');
        orb.className = 'orb big';
        const h = document.createElement('h2');
        h.textContent = `Hi ${localStorage.getItem('sarjy_username') || 'there'}, I'm Sarjy`;
        const p = document.createElement('p');
        p.textContent = 'Talk to me or type. I remember what you tell me across sessions, and I can book a call with our team for you.';
        const chips = document.createElement('div');
        chips.className = 'chips';
        for (const s of ['Book a call with your sales team', 'What do you remember about me?', "Hi, I'm new here, what can you do?"]) {
          const b = document.createElement('button');
          b.className = 'chip';
          b.textContent = s;
          b.onclick = () => sendMessage(s);
          chips.appendChild(b);
        }
        wrap.append(orb, h, p, chips);
        logEl.appendChild(wrap);
      }

      function newChat() {
        stopSpeaking();
        conversationId = null;
        showEmptyState();
        setStatus('idle');
        setBusy(false);
      }
      $('new-chat').onclick = newChat;

      // ---------- sending a message ----------
      $('composer').onsubmit = (e) => {
        e.preventDefault();
        const text = $('msg').value.trim();
        if (!text || busy) return;
        $('msg').value = '';
        sendMessage(text);
      };

      async function sendMessage(text, alreadyShown = false) {
        if (busy && !alreadyShown) return;
        stopSpeaking();
        setBusy(true);
        if (!alreadyShown) addRow('user', text);
        const pending = addTypingRow();
        setStatus('thinking');
        try {
          const res = await api('/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversation_id: conversationId, message: text }),
          });
          if (!res.ok) throw new Error('bad response');
          const j = await res.json();
          conversationId = j.conversation_id;
          await speakAndType(pending.body, j.reply);
          // memory is saved in the background after the reply, so check for new facts shortly after
          setTimeout(loadMemory, 2500);
        } catch (err) {
          if (err.message === 'signed out') return;
          pending.row.classList.add('error');
          pending.body.textContent = 'Something went wrong, please try again.';
        } finally {
          setStatus('idle');
          setBusy(false);
        }
      }

      // ---------- voice out + text typed in time with it ----------
      let currentAudio = null;
      let typingTimer = null;
      let finishTyping = null;

      function typeOut(el, text, totalMs) {
        return new Promise((resolve) => {
          const words = text.split(/(\s+)/);
          const step = Math.max(15, Math.min(220, totalMs / Math.max(words.length, 1)));
          let i = 0;
          el.textContent = '';
          el.classList.add('cursor');
          finishTyping = () => {
            clearInterval(typingTimer);
            el.textContent = text;
            el.classList.remove('cursor');
            finishTyping = null;
            resolve();
          };
          typingTimer = setInterval(() => {
            el.textContent += words[i++] || '';
            scrollDown();
            if (i >= words.length) finishTyping();
          }, step);
        });
      }

      async function fetchSpeech(text) {
        // give up after 12s and use the browser voice instead (OpenAI TTS occasionally stalls)
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 12000);
        try {
          const form = new FormData();
          form.append('text', text);
          const res = await api('/tts', { method: 'POST', body: form, signal: controller.signal });
          if (!(res.headers.get('content-type') || '').startsWith('audio/')) return null;
          return URL.createObjectURL(await res.blob());
        } catch (e) {
          return null;
        } finally {
          clearTimeout(timer);
        }
      }

      async function speakAndType(el, text) {
        if (!voiceOn) {
          await typeOut(el, text, text.length * 18);
          return;
        }
        setStatus('voicing');
        const url = await fetchSpeech(text);
        setStatus('speaking');

        if (url) {
          const audio = new Audio(url);
          currentAudio = audio;
          await new Promise((r) => { audio.onloadedmetadata = r; audio.onerror = r; });
          const duration = isFinite(audio.duration) ? audio.duration * 1000 : text.length * 60;
          const done = new Promise((r) => { audio.onended = r; audio.onpause = r; });
          audio.play().catch(() => {});
          await typeOut(el, text, duration * 0.92);
          await done;
          URL.revokeObjectURL(url);
          currentAudio = null;
          return;
        }

        // fallback: the browser's built-in voice
        try {
          const u = new SpeechSynthesisUtterance(text);
          const done = new Promise((r) => { u.onend = r; u.onerror = r; });
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
          await typeOut(el, text, text.length * 60);
          await Promise.race([done, new Promise((r) => setTimeout(r, 30000))]);
        } catch (e) {
          await typeOut(el, text, text.length * 18);
        }
      }

      function stopSpeaking() {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        try { speechSynthesis.cancel(); } catch (e) {}
        if (finishTyping) finishTyping();
      }
      $('stop').onclick = stopSpeaking;

      function renderVoiceToggle() {
        $('voice-toggle').classList.toggle('voice-off', !voiceOn);
        $('voice-waves').style.display = voiceOn ? '' : 'none';
        $('voice-toggle').title = voiceOn ? 'Voice replies on (click to mute)' : 'Voice replies off (click to unmute)';
      }
      $('voice-toggle').onclick = () => {
        voiceOn = !voiceOn;
        try { localStorage.setItem('sarjy_voice', voiceOn ? 'on' : 'off'); } catch (e) {}
        if (!voiceOn) stopSpeaking();
        renderVoiceToggle();
      };

      // ---------- voice in: record -> upload -> transcribe -> send ----------
      let recording = false;
      let mediaRecorder = null;
      let chunks = [];
      let levelFrame = null;
      let audioCtx = null;
      let recordStart = 0;

      $('record').onclick = async () => {
        if (recording) { mediaRecorder.stop(); return; }
        if (busy) return;
        stopSpeaking();

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          addRow('error', 'I need microphone access to hear you. Check your browser permissions and try again.');
          return;
        }

        recording = true;
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          recording = false;
          stream.getTracks().forEach((t) => t.stop());
          cancelAnimationFrame(levelFrame);
          audioCtx?.close();
          $('record').classList.remove('recording');
          $('record').style.setProperty('--level', 0);
          uploadRecording(new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' }));
        };
        mediaRecorder.start();
        recordStart = Date.now();
        $('record').classList.add('recording');
        setStatus('listening');
        showLevel(stream);
      };

      // makes the ring around the mic grow with your voice, and shows a timer
      function showLevel(stream) {
        audioCtx = new AudioContext();
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        audioCtx.createMediaStreamSource(stream).connect(analyser);
        const data = new Uint8Array(analyser.fftSize);
        const tick = () => {
          analyser.getByteTimeDomainData(data);
          let sum = 0;
          for (const v of data) sum += ((v - 128) / 128) ** 2;
          const level = Math.min(1, Math.sqrt(sum / data.length) * 4);
          $('record').style.setProperty('--level', level.toFixed(2));
          const secs = Math.floor((Date.now() - recordStart) / 1000);
          $('status-text').textContent = `Listening… ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}  (tap the mic again to send)`;
          levelFrame = requestAnimationFrame(tick);
        };
        tick();
      }

      function uploadRecording(blob) {
        setBusy(true);
        setStatus('uploading');
        const form = new FormData();
        form.append('audio', blob, blob.type.includes('mp4') ? 'audio.mp4' : 'audio.webm');

        // XMLHttpRequest instead of fetch() so we can show upload progress
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/transcribe');
        xhr.setRequestHeader('Authorization', `Bearer ${token()}`);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) setStatus('uploading', `Uploading your recording… ${Math.round((e.loaded / e.total) * 100)}%`);
        };
        xhr.upload.onload = () => setStatus('transcribing');
        xhr.onload = () => {
          if (xhr.status === 401) return logout();
          let transcript = '';
          try { transcript = (JSON.parse(xhr.responseText).transcript || '').trim(); } catch (e) {}
          if (!transcript) {
            addRow('error', "I didn't catch that. Try again, a little closer to the mic.");
            setStatus('idle');
            setBusy(false);
            return;
          }
          addRow('user', transcript, '🎙 You said');
          setBusy(false);
          sendMessage(transcript, true);
        };
        xhr.onerror = () => {
          addRow('error', 'Upload failed, please try again.');
          setStatus('idle');
          setBusy(false);
        };
        xhr.send(form);
      }

      // ---------- memory panel ----------
      $('memory-toggle').onclick = () => { $('memory-panel').hidden = !$('memory-panel').hidden; };
      $('memory-close').onclick = () => { $('memory-panel').hidden = true; };

      function prettyKey(key) {
        const s = key.replace(/_/g, ' ');
        return s.charAt(0).toUpperCase() + s.slice(1);
      }

      async function loadMemory() {
        let items = [];
        try {
          const res = await api('/memory');
          items = (await res.json()).items || [];
        } catch (e) { return; }

        const list = $('memory-list');
        list.textContent = '';
        $('memory-count').textContent = items.length;
        if (!items.length) {
          const li = document.createElement('li');
          li.className = 'memory-empty';
          li.textContent = 'Nothing yet. Tell Sarjy about yourself, like your name, your job or your favorite food.';
          list.appendChild(li);
        }
        for (const item of items) {
          const li = document.createElement('li');
          li.className = 'memory-item' + (memoryLoaded && !knownMemoryIds.has(item.id) ? ' new' : '');
          const text = document.createElement('div');
          text.className = 'text';
          const k = document.createElement('span');
          k.className = 'k';
          k.textContent = prettyKey(item.key);
          const v = document.createElement('span');
          v.className = 'v';
          v.textContent = item.value;
          text.append(k, v);
          const forget = document.createElement('button');
          forget.textContent = '×';
          forget.title = 'Forget this';
          forget.onclick = async () => {
            await api(`/memory/${item.id}`, { method: 'DELETE' });
            loadMemory();
          };
          li.append(text, forget);
          list.appendChild(li);
        }
        knownMemoryIds = new Set(items.map((i) => i.id));
        memoryLoaded = true;
      }

      showApp();
    </script>
  </body>
</html>
